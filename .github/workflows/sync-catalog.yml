
name: Sync Danon Images
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: danon-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/792996680914/locations/global/workloadIdentityPools/danon-github/providers/danon-github-provider
          service_account: danon-image-sync@danon-product-finder.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install google-api-python-client google-auth
      - name: Download catalog
        env:
          DRIVE_FOLDER_ID: '1_GDcbzpphhFi91QqHSZ6Eetz1_2dsmx4'
        run: python sync_drive.py
      - name: Commit updated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/
          if ! git diff --cached --quiet; then
            git commit -m 'Update Danon image catalog'
            git push
          fi
